
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <h2>My Profile</h2>
    </header>

    <main class="profile-container">

        <section class="profile-card card-blue">
            <img src="https://placehold.co/150x150" alt="Profile photo" class="avatar">

            <h2>Ratan Priya Srivastava </h2>
            <p class="role">B.Tech CSE Student</p>

            <h3>About Me</h3>
            <div class="bio">
                I am a first-year B.Tech CSE student.
                I enjoy learning Java, HTML and CSS.
                I want to improve my programming skills
                and create interesting projects.
                I am eager to learn new things and
                solve coding problems.
            </div>
        </section>

        
    </main>

    <button class="add-button" aria-label="Add profile">+</button>

</body>
</html>
